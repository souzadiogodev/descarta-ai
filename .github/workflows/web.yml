name: Web

on:
  push:
    branches: [main, dev]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CONTATO_EMAIL: ${{ vars.VITE_CONTATO_EMAIL }}
          VITE_NSI_CNPJ: ${{ vars.VITE_NSI_CNPJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 7

  deploy:
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_HABILITADO == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-web
    environment: producao
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=descarta-ai --branch=main
